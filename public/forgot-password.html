<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Recover account — Senlay</title><link rel="stylesheet" href="/styles/landing.css?v=4"><style>main{max-width:540px;margin:70px auto;padding:24px}.box{background:#111c2e;border:1px solid #26344a;border-radius:10px;padding:28px}label{display:block;margin:18px 0 7px}input{box-sizing:border-box;width:100%;padding:12px;background:#07111f;border:1px solid #334155;border-radius:7px;color:#fff}button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:7px;background:#34d399;font-weight:800}.msg{margin-top:16px;color:#a7f3d0}.err{color:#fca5a5}a{color:#34d399}</style></head><body><main><div class="box"><h1>Recover your account</h1><p>Enter your account email. If it exists, Senlay will send a one-time link valid for 30 minutes.</p><label for="email">Email</label><input id="email" type="email" autocomplete="email"><button id="send">Send reset link</button><div id="msg" class="msg" role="status"></div><p><a href="/login.html">Back to sign in</a></p></div></main><script>document.getElementById('send').onclick=async()=>{const msg=document.getElementById('msg');msg.className='msg';msg.textContent='Sending…';try{const r=await fetch('/api/password/forgot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim()})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to send reset email');msg.textContent=d.message}catch(e){msg.className='msg err';msg.textContent=e.message}};</script></body></html>
