<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Reset password — Senlay</title><link rel="stylesheet" href="/styles/landing.css?v=4"><style>main{max-width:540px;margin:70px auto;padding:24px}.box{background:#111c2e;border:1px solid #26344a;border-radius:10px;padding:28px}label{display:block;margin:18px 0 7px}input{box-sizing:border-box;width:100%;padding:12px;background:#07111f;border:1px solid #334155;border-radius:7px;color:#fff}button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:7px;background:#34d399;font-weight:800}.msg{margin-top:16px;color:#a7f3d0}.err{color:#fca5a5}a{color:#34d399}</style></head><body><main><div class="box"><h1>Choose a new password</h1><p>Use at least 12 characters. Completing this reset signs the account out on every device.</p><label for="password">New password</label><input id="password" type="password" minlength="12" autocomplete="new-password"><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="12" autocomplete="new-password"><button id="reset">Reset password</button><div id="msg" class="msg" role="status"></div><p><a href="/login.html">Back to sign in</a></p></div></main><script>document.getElementById('reset').onclick=async()=>{const msg=document.getElementById('msg'),password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(password!==confirm){msg.className='msg err';msg.textContent='Passwords do not match.';return}msg.className='msg';msg.textContent='Resetting…';try{const token=new URLSearchParams(location.search).get('token')||'';const r=await fetch('/api/password/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,newPassword:password})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to reset password');msg.replaceChildren(document.createTextNode('Password reset. '));const a=document.createElement('a');a.href='/login.html';a.textContent='Sign in now';msg.appendChild(a)}catch(e){msg.className='msg err';msg.textContent=e.message}};</script></body></html>
