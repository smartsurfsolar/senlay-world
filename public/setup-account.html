<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Set up Senlay account</title><style>:root{--paper:#f7f4ee;--ink:#15161a;--blue:#276ef1;--coral:#e85d3f}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}main{max-width:520px;margin:10vh auto;padding:30px;background:#fff;border:1px solid #d8d2c6;border-radius:8px}label{display:block;margin:16px 0}input,button{width:100%;padding:12px;border:1px solid #aaa49a;border-radius:8px;font:inherit}button{background:var(--blue);color:#fff;font-weight:700}.error{color:var(--coral)}</style></head><body><main><h1>Set up your account</h1><p>This one-time link sets your password. Senlay staff cannot see it.</p><form id="form"><label>New password (12+ characters)<input id="password" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required></label><label>Confirm password<input id="confirm" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required></label><button>Set password</button></form><p id="message" aria-live="polite"></p></main><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('message'),p=document.getElementById('password').value;if(p!==document.getElementById('confirm').value){m.className='error';m.textContent='Passwords do not match.';return}const token=new URLSearchParams(location.search).get('token')||'';const r=await fetch('/api/account/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p})});const d=await r.json().catch(()=>({}));m.className=r.ok?'':'error';m.textContent=r.ok?'Password set. Redirecting to sign in…':(d.error||'Unable to set password.');if(r.ok)setTimeout(()=>location.href='/login.html',1200)};</script></body></html>
